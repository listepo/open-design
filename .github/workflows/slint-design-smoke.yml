# Community plugin smoke: slint-viewer --check for slint-design.
# Pinned viewer: 1.18.1 (required for --size 1280x800 / 390x844).
# Path-filtered; installs the pin so CI does not rely on host PATH.
name: slint-design smoke

on:
  push:
    paths:
      - "plugins/community/slint-design/**"
      - ".github/workflows/slint-design-smoke.yml"
  pull_request:
    paths:
      - "plugins/community/slint-design/**"
      - ".github/workflows/slint-design-smoke.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: slint-viewer-1.18.1

      - name: Install slint-viewer (pinned)
        run: |
          cargo install slint-viewer --version 1.18.1 --locked --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show version
        run: slint-viewer --version

      - name: Run smoke (--check)
        run: bash plugins/community/slint-design/scripts/smoke.sh

      - name: Optional multi-size screenshot (best-effort)
        run: |
          set -euo pipefail
          EX=plugins/community/slint-design/examples/hello-window.slint
          OUT=/tmp/slint-smoke
          mkdir -p "$OUT"
          if slint-viewer --help 2>&1 | grep -q -- '--size'; then
            slint-viewer --screenshot "$OUT/desktop.png" --size 1280x800 "$EX"
            slint-viewer --screenshot "$OUT/mobile.png" --size 390x844 "$EX"
            ls -la "$OUT"
          else
            echo "slint-viewer lacks --size; skipping multi-size screenshot"
            slint-viewer --screenshot "$OUT/default.png" "$EX"
          fi
