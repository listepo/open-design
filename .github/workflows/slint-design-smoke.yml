# Community plugin smoke: slint-viewer --check for slint-design.
# Pinned viewer: 1.18.1 (required for --size 1280x800 / 390x844).
# Path-filtered; installs the pin so CI does not rely on host PATH.
name: slint-design smoke

on:
  push:
    paths:
      - "plugins/community/slint-design/**"
      - ".github/workflows/slint-design-smoke.yml"
  pull_request:
    paths:
      - "plugins/community/slint-design/**"
      - ".github/workflows/slint-design-smoke.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: slint-viewer-1.18.1

      - name: Install slint-viewer (pinned)
        run: |
          cargo install slint-viewer --version 1.18.1 --locked --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show version
        run: slint-viewer --version

      - name: Run smoke (--check + best-effort --size screenshots)
        run: bash plugins/community/slint-design/scripts/smoke.sh
